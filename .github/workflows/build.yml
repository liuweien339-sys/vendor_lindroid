name: Build APK

on:
  push:
    branches: [ main ] # 当代码推送到 main 分支时触发
  workflow_dispatch:   # 允许在 GitHub 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 运行环境

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK 17 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          
      - name: Generate keystore.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> app/keystore.properties
          echo "storeFile=${{ secrets.STORE_FILE }}" >> app/keystore.properties

      - name: Generate Temporary Keystore
        run: |
          # 使用 keytool 生成一个有效期 10000 天的临时 keystore
          keytool -genkeypair -v \
            -storetype JKS \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -keystore app/${{ secrets.STORE_FILE }} \
            -alias ${{ secrets.KEY_ALIAS }} \
            -storepass ${{ secrets.STORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=CN"
        shell: bash

      # 4. 赋予 gradlew 可执行权限（这一步非常重要，常被遗漏）
      - name: Make gradlew executable
        run: 
              cd app
  
              chmod +x ./gradlew

      # 5. 编译 Debug APK
      - name: Build Debug APK
        run: 
              cd app
         
              ./gradlew assembleDebug

      # 6. 上传编译产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lindroid-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
